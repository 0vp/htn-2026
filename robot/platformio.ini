; Robot base controller on an ELEGOO ESP32 (ESP-WROOM-32 DevKit). The ESP32-S3-CAM only streams video.

[env:robot]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.4.2
  madhephaestus/ESP32Encoder@0.11.7

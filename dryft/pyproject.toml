[project]
name = "dryft-kernel-rush"
version = "0.1.0"
description = "Hack the North 2026 Kernel Rush workspace"
requires-python = "==3.11.14"
dependencies = []

[project.optional-dependencies]
gpu = [
    "torch==2.5.1+cu124; sys_platform == 'linux'",
    "triton==3.1.0; sys_platform == 'linux'",
    "transformers==4.51.3; sys_platform == 'linux'",
    "safetensors==0.5.3; sys_platform == 'linux'",
    "tokenizers==0.21.1; sys_platform == 'linux'",
]

[tool.uv]
required-version = "==0.10.0"
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

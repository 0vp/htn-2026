[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "htn-backend"
version = "0.4.0"
description = "HTN room mapping API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "numpy>=2,<3",
    "websockets>=14,<16",
    "pillow>=11,<13",
    "httpx>=0.28,<1",
    "opencv-python-headless>=4.10,<5",
    "scipy>=1.14,<2",
    "pyyaml>=6,<7",
    "open3d==0.19.0",
    "pyserial>=3.5,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/htn_backend"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
sim = [
    "mujoco==3.3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

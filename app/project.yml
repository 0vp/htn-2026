name: HTNApp
options:
  bundleIdPrefix: com.htn2026
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
targets:
  HTNApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: WebRTC
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: HTN
        NSLocationWhenInUseUsageDescription: Share an approximate room location and compass heading with your room dashboard.
        NSMicrophoneUsageDescription: Talk to your room assistant using GPT-Live.
        NSCameraUsageDescription: Camera and LiDAR stream to your shared room. The camera also scans room QR codes.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.htn2026.room
            CFBundleURLSchemes: [htnroom]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        INFOPLIST_KEY_NSCameraUsageDescription: Camera and depth capture let you scan a room.
        PRODUCT_BUNDLE_IDENTIFIER: com.htn2026.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: HTN
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  HTNAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HTNApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HTNAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HTNApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HTNApp:
    build:
      targets:
        HTNApp: all
    test:
      targets: [HTNAppTests, HTNAppUITests]
